[project]
name = "along"
version = "0.1.0"
description = "Evidence-aware visual companion for hands-on tasks"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20", "pillow>=11,<13", "numpy>=2,<3", "mcp>=1.12,<2", "python-dotenv>=1,<2", "pypdf>=5,<7"]

[project.optional-dependencies]
# faster-whisper currently calls av.open(metadata_errors=...), removed in newer PyAV.
speech = ["faster-whisper>=1.1,<2", "av>=11,<16"]
semantic = ["sentence-transformers>=3,<6"]
device = ["opencv-python-headless>=4.10,<5", "sounddevice>=0.5,<1", "soundfile>=0.13,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
along = "along.cli:main"
along-device = "along.device:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
