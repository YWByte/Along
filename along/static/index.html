<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ALONG · 一起完成</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header>
      <div>
        <span class="brand">ALONG<span class="dot">●</span></span
        ><span class="tagline">看见过程，一起完成。</span>
      </div>
      <span id="connection" class="badge">连接中</span>
    </header>
    <main>
      <section id="home" class="home">
        <h1>今天，一起做点什么？</h1>
        <p class="muted">看懂眼前的东西，或一起完成一件事。</p>
        <div class="mode-choices">
          <button id="enter-task" class="mode-card" disabled>
            <strong>任务模式</strong><span>告诉我目标，一起完成</span>
          </button>
          <button id="enter-instant" class="mode-card" disabled>
            <strong>识别模式</strong><span>拍下来，问问题</span>
          </button>
        </div>
      </section>
      <section id="session" hidden>
        <nav class="section-head">
          <button id="back-home">← 返回首页</button
          ><span id="mode-title">识别模式</span
          ><span id="stage" class="muted"></span>
        </nav>
        <div id="workspace" class="workspace">
          <section id="camera-panel" class="panel camera-panel" hidden>
            <div class="section-head">
              <h2 id="camera-title">拍下你想问的东西</h2>
              <span id="capture-status" class="badge">相机未开启</span>
            </div>
            <div class="viewfinder">
              <video id="camera" autoplay muted playsinline></video>
              <img id="uploaded-preview" alt="本次提问的照片" hidden />
              <div id="camera-placeholder" role="status">正在打开相机…</div>
            </div>
            <div class="toolbar camera-actions">
              <button id="camera-toggle">重试开启相机</button
              ><button id="take-photo" class="primary">拍照</button
              ><button id="retake-photo" hidden>重拍</button>
            </div>
            <p id="camera-hint" class="muted"></p>
          </section>
          <div class="interaction">
            <section id="task-panel" class="panel task-panel" hidden>
              <div class="section-head">
                <h2 id="task-heading">确认方案</h2>
                <span id="task-status" class="badge"></span>
              </div>
              <div id="task-content"></div>
              <div class="toolbar">
                <button id="confirm-plan" class="primary" hidden>
                  开始任务</button
                ><button id="resume-task" class="primary" hidden>
                  继续任务</button
                ><button id="retry-plan" hidden>重新生成方案</button>
              </div>
              <p id="record-consent" class="muted" hidden>
                开始后，相机会持续记录过程。需要分析的图片和文字会发送至模型；记录保存在本机。AI
                不能认证操作安全。
              </p>
            </section>
            <section class="panel chat-panel">
              <h2 id="chat-heading">有什么想问的？</h2>
              <p id="chat-hint" class="muted"></p>
              <div id="messages" aria-live="polite"></div>
              <div id="activity" class="muted" role="status"></div>
              <form id="chat-form">
                <textarea
                  id="question"
                  rows="2"
                  maxlength="4000"
                  placeholder="输入问题…"
                  aria-label="问题或任务目标"
                  required
                ></textarea>
                <div class="toolbar">
                  <button type="button" id="mic">语音提问</button
                  ><button type="submit" id="send" class="primary">发送</button>
                </div>
              </form>
            </section>
          </div>
        </div>
        <details id="task-more" class="secondary" hidden>
          <summary>任务选项与记录</summary>
          <div class="toolbar">
            <button id="pause-task">暂停任务</button
            ><button id="finish-task">结束任务</button>
          </div>
          <details>
            <summary>补充资料或调整方案</summary>
            <form id="prepare-form" class="stack">
              <input
                id="source-url"
                type="url"
                placeholder="可选：说明书或菜谱网址"
                aria-label="资料网址"
              /><input
                id="revision-reason"
                maxlength="2000"
                placeholder="告诉我需要调整什么"
                aria-label="调整原因"
              /><button>重新生成方案</button>
            </form>
            <label class="file-button"
              >导入说明书<input
                id="source-file"
                type="file"
                accept=".pdf,.txt,.md,application/pdf,text/plain,text/markdown"
                hidden
            /></label>
            <p class="muted">
              调整前先暂停，新方案需重新确认。支持文字 PDF、TXT、Markdown。
            </p>
          </details>
          <details>
            <summary>过程记录</summary>
            <div class="toolbar">
              <select id="history-task" aria-label="历史任务"></select
              ><button id="timeline-refresh">查看记录</button
              ><button id="delete-task" class="danger">删除所选任务</button>
            </div>
            <div id="timeline"></div>
          </details>
          <details>
            <summary>运行状态</summary>
            <p id="queue-status" class="muted"></p>
            <p id="diagnostics" class="muted"></p>
            <button id="retry-jobs">重试失败的记录整理</button>
          </details>
        </details>
        <p id="privacy-note" class="muted small">
          拍照并发送问题后，照片和问题会发送至模型进行分析。
        </p>
      </section>
    </main>
    <div id="toast" role="alert" hidden></div>
    <dialog id="evidence-dialog">
      <button id="close-dialog">关闭</button>
      <div id="evidence-content"></div>
    </dialog>
    <footer>ALONG · 不确定时，先补充依据。</footer>
  </body>
</html>
